<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flag Quiz</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:48rem;margin:2rem auto;text-align:center;padding:0 1rem}
  #prompt{margin:1.5rem 0}
  #prompt.flag{font-size:5rem}
  #prompt.name{font-size:2rem;font-weight:600}
  #options{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin:1rem 0}
  #options button{padding:.6rem 1rem;cursor:pointer;border:1px solid #ccc;border-radius:6px;background:#f5f5f5}
  #options button.correct{background:#bff0bf;border-color:#2e7d32}
  #options button.wrong{background:#f0bfbf;border-color:#c62828}
  #feedback{min-height:1.5em;font-weight:600}
  #stats{color:#555}
  #reset{margin-top:2rem;font-size:.8rem;color:#999;background:none;border:none;cursor:pointer;text-decoration:underline}
  body:has(#prompt.flag) #options button{font-size:1rem}
  body:has(#prompt.name) #options button{font-size:5rem}
</style>

</head>
<body>
<p id="stats"></p>
<div id="prompt"></div>
<div id="options"></div>
<p id="feedback"></p>
<button id="next" hidden>Next question</button>
<p><button id="reset">Reset stats</button></p>

<script>
// One-time reset to version 2: start fresh (drop old box/mastery/stats data).
if (localStorage.getItem("flagQuizVersion") !== "2") {
  localStorage.removeItem("flagQuizStats");
  localStorage.removeItem("flagQuizCards");
  localStorage.removeItem("flagQuizMatrix");
  localStorage.setItem("flagQuizVersion", "2");
}
const COUNTRIES = [
["Afghanistan","AF"],["Albania","AL"],["Algeria","DZ"],["Andorra","AD"],["Angola","AO"],
["Antigua and Barbuda","AG"],["Argentina","AR"],["Armenia","AM"],["Australia","AU"],["Austria","AT"],
["Azerbaijan","AZ"],["Bahamas","BS"],["Bahrain","BH"],["Bangladesh","BD"],["Barbados","BB"],
["Belarus","BY"],["Belgium","BE"],["Belize","BZ"],["Benin","BJ"],["Bhutan","BT"],
["Bolivia","BO"],["Bosnia and Herzegovina","BA"],["Botswana","BW"],["Brazil","BR"],["Brunei","BN"],
["Bulgaria","BG"],["Burkina Faso","BF"],["Burundi","BI"],["Cape Verde","CV"],["Cambodia","KH"],
["Cameroon","CM"],["Canada","CA"],["Central African Republic","CF"],["Chad","TD"],["Chile","CL"],
["China","CN"],["Colombia","CO"],["Comoros","KM"],["Congo","CG"],["DR Congo","CD"],
["Costa Rica","CR"],["Croatia","HR"],["Cuba","CU"],["Cyprus","CY"],["Czechia","CZ"],
["Denmark","DK"],["Djibouti","DJ"],["Dominica","DM"],["Dominican Republic","DO"],["Ecuador","EC"],
["Egypt","EG"],["El Salvador","SV"],["Equatorial Guinea","GQ"],["Eritrea","ER"],["Estonia","EE"],
["Eswatini","SZ"],["Ethiopia","ET"],["Fiji","FJ"],["Finland","FI"],["France","FR"],
["Gabon","GA"],["Gambia","GM"],["Georgia","GE"],["Germany","DE"],["Ghana","GH"],
["Greece","GR"],["Grenada","GD"],["Guatemala","GT"],["Guinea","GN"],["Guinea-Bissau","GW"],
["Guyana","GY"],["Haiti","HT"],["Honduras","HN"],["Hungary","HU"],["Iceland","IS"],
["India","IN"],["Indonesia","ID"],["Iran","IR"],["Iraq","IQ"],["Ireland","IE"],
["Israel","IL"],["Italy","IT"],["Ivory Coast","CI"],["Jamaica","JM"],["Japan","JP"],
["Jordan","JO"],["Kazakhstan","KZ"],["Kenya","KE"],["Kiribati","KI"],["Kosovo","XK"],
["Kuwait","KW"],["Kyrgyzstan","KG"],["Laos","LA"],["Latvia","LV"],["Lebanon","LB"],
["Lesotho","LS"],["Liberia","LR"],["Libya","LY"],["Liechtenstein","LI"],["Lithuania","LT"],
["Luxembourg","LU"],["Madagascar","MG"],["Malawi","MW"],["Malaysia","MY"],["Maldives","MV"],
["Mali","ML"],["Malta","MT"],["Marshall Islands","MH"],["Mauritania","MR"],["Mauritius","MU"],
["Mexico","MX"],["Micronesia","FM"],["Moldova","MD"],["Monaco","MC"],["Mongolia","MN"],
["Montenegro","ME"],["Morocco","MA"],["Mozambique","MZ"],["Myanmar","MM"],["Namibia","NA"],
["Nauru","NR"],["Nepal","NP"],["Netherlands","NL"],["New Zealand","NZ"],["Nicaragua","NI"],
["Niger","NE"],["Nigeria","NG"],["North Korea","KP"],["North Macedonia","MK"],["Norway","NO"],
["Oman","OM"],["Pakistan","PK"],["Palau","PW"],["Palestine","PS"],["Panama","PA"],
["Papua New Guinea","PG"],["Paraguay","PY"],["Peru","PE"],["Philippines","PH"],["Poland","PL"],
["Portugal","PT"],["Qatar","QA"],["Romania","RO"],["Russia","RU"],["Rwanda","RW"],
["Saint Kitts and Nevis","KN"],["Saint Lucia","LC"],["Saint Vincent and the Grenadines","VC"],
["Samoa","WS"],["San Marino","SM"],["Sao Tome and Principe","ST"],["Saudi Arabia","SA"],
["Senegal","SN"],["Serbia","RS"],["Seychelles","SC"],["Sierra Leone","SL"],["Singapore","SG"],
["Slovakia","SK"],["Slovenia","SI"],["Solomon Islands","SB"],["Somalia","SO"],["South Africa","ZA"],
["South Korea","KR"],["South Sudan","SS"],["Spain","ES"],["Sri Lanka","LK"],["Sudan","SD"],
["Suriname","SR"],["Sweden","SE"],["Switzerland","CH"],["Syria","SY"],["Taiwan","TW"],
["Tajikistan","TJ"],["Tanzania","TZ"],["Thailand","TH"],["Timor-Leste","TL"],["Togo","TG"],
["Tonga","TO"],["Trinidad and Tobago","TT"],["Tunisia","TN"],["Turkey","TR"],["Turkmenistan","TM"],
["Tuvalu","TV"],["Uganda","UG"],["Ukraine","UA"],["United Arab Emirates","AE"],["United Kingdom","GB"],
["United States","US"],["Uruguay","UY"],["Uzbekistan","UZ"],["Vanuatu","VU"],["Vatican City","VA"],
["Venezuela","VE"],["Vietnam","VN"],["Yemen","YE"],["Zambia","ZM"],["Zimbabwe","ZW"]
];

const flag = c => String.fromCodePoint(...[...c].map(ch => 127397 + ch.charCodeAt(0)));

const KEY = "flagQuizStats";
const stats = Object.assign({ total: 0, correct: 0, streak: 0, best: 0 },
  JSON.parse(localStorage.getItem(KEY) || "{}"));

const MATRIX_KEY = "flagQuizMatrix";
const MASTERED = 0.9;
const EPS = 0.25;   // exploration rate for distractor sampling
const BOOST = 2;    // how strongly a confusable partner raises question frequency
const N = COUNTRIES.length;
const codeIndex = new Map(COUNTRIES.map((c, i) => [c[1], i]));

// N×N matrix. Diagonal = mastery; upper triangle (i<j) = flag→name confusion;
// lower triangle (i>j) = name→flag confusion. Off-diagonal seeds at 0.5 (unknown).
const storedMatrix = JSON.parse(localStorage.getItem(MATRIX_KEY) || "null");
const matrix = [];
if (Array.isArray(storedMatrix) && storedMatrix.length === N &&
    storedMatrix.every(r => Array.isArray(r) && r.length === N)) {
  for (const r of storedMatrix) matrix.push(r.slice());
} else {
  for (let r = 0; r < N; r++) {
    const row = new Array(N).fill(0.5);
    row[r] = 0;  // mastery starts at 0
    matrix.push(row);
  }
}

let current = null;

const $ = id => document.getElementById(id);
const shuffle = a => a.sort(() => Math.random() - .5);

// Confusion cells keyed by (unordered pair, mode): name→flag (ntf=true) below the
// diagonal, flag→name above it.
const confusionCell = (a, b, ntf) => {
  const lo = Math.min(a, b), hi = Math.max(a, b);
  return ntf ? [hi, lo] : [lo, hi];
};
const incConfusion = (a, b, ntf) => {
  const [r, c] = confusionCell(a, b, ntf);
  matrix[r][c] += 0.25 * (1 - matrix[r][c]);
};
const decConfusion = (a, b, ntf) => {
  const [r, c] = confusionCell(a, b, ntf);
  matrix[r][c] *= 0.95;
};

function save() {
  localStorage.setItem(KEY, JSON.stringify(stats));
  localStorage.setItem(MATRIX_KEY, JSON.stringify(matrix));
  renderStats();
}

function renderStats() {
  const pct = stats.total ? Math.round(100 * stats.correct / stats.total) : 0;
  let mastered = 0;
  for (let i = 0; i < N; i++) if (matrix[i][i] >= MASTERED) mastered++;
  $("stats").textContent =
    `Score: ${stats.correct}/${stats.total} (${pct}%) · Streak: ${stats.streak} · Best: ${stats.best} · Mastered: ${mastered}/${N}`;
}

function pickCountryIndex(ntf) {
  const weights = new Array(N);
  let total = 0;
  for (let i = 0; i < N; i++) {
    let topConf = 0;
    for (let k = 0; k < N; k++) {
      if (k === i) continue;
      const [r, c] = confusionCell(i, k, ntf);
      if (matrix[r][c] > topConf) topConf = matrix[r][c];
    }
    weights[i] = (1 - matrix[i][i]) + BOOST * Math.max(0, topConf - 0.5);
    total += weights[i];
  }
  let r = Math.random() * total;
  for (let i = 0; i < N; i++) {
    r -= weights[i];
    if (r <= 0) return i;
  }
  return N - 1;
}

function sampleDistractors(i, ntf, count) {
  const ranked = [];
  for (let k = 0; k < N; k++) {
    if (k === i) continue;
    const [r, c] = confusionCell(i, k, ntf);
    ranked.push({ k, v: matrix[r][c] });
  }
  ranked.sort((a, b) => b.v - a.v);

  const out = [];
  const used = new Set([i]);
  for (let slot = 0; slot < count; slot++) {
    let k = null;
    if (Math.random() >= EPS) {
      for (const cand of ranked) {
        if (!used.has(cand.k) && cand.v > 0.5) { k = cand.k; break; }
      }
    }
    if (k === null) {
      do { k = Math.floor(Math.random() * N); } while (used.has(k));
    }
    used.add(k);
    out.push(k);
  }
  return out;
}

function newQuestion() {
  const ntf = Math.random() < .5;
  const i = pickCountryIndex(ntf);
  const country = COUNTRIES[i];
  const numOpts = matrix[i][i] >= MASTERED ? 10 : 4;
  const opts = [country];
  for (const k of sampleDistractors(i, ntf, numOpts - 1)) opts.push(COUNTRIES[k]);
  current = { country, options: shuffle(opts), nameToFlag: ntf };

  const prompt = $("prompt");
  if (current.nameToFlag) {
    prompt.className = "name";
    prompt.textContent = current.country[0];
  } else {
    prompt.className = "flag";
    prompt.textContent = flag(current.country[1]);
  }

  $("feedback").textContent = "";
  $("next").hidden = true;
  const container = $("options");
  container.innerHTML = "";
  for (const opt of current.options) {
    const b = document.createElement("button");
    b.textContent = current.nameToFlag ? flag(opt[1]) : opt[0];
    b.dataset.code = opt[1];
    b.onclick = () => answer(opt);
    container.appendChild(b);
  }
}

function answer(opt) {
  const i = codeIndex.get(current.country[1]);
  const j = codeIndex.get(opt[1]);
  const correct = j === i;
  const ntf = current.nameToFlag;

  stats.total++;
  if (correct) {
    matrix[i][i] += 0.05 * (1 - matrix[i][i]);
    stats.correct++;
    stats.streak++;
    stats.best = Math.max(stats.best, stats.streak);
    for (const o of current.options) {
      const k = codeIndex.get(o[1]);
      if (k !== i) decConfusion(i, k, ntf);
    }
  } else {
    matrix[i][i] *= 0.8;   // mastery down (target): −20%
    matrix[j][j] *= 0.95;  // mastery down (chosen): −5%
    stats.streak = 0;
    incConfusion(i, j, ntf);
    for (const o of current.options) {
      const k = codeIndex.get(o[1]);
      if (k !== i && k !== j) decConfusion(i, k, ntf);
    }
  }
  save();

  for (const b of $("options").children) {
    b.disabled = true;
    if (b.dataset.code === current.country[1]) b.classList.add("correct");
    else if (b.dataset.code === opt[1]) b.classList.add("wrong");
  }
  const mastery = Math.round(matrix[i][i] * 100);
  $("feedback").textContent = correct
    ? `Correct! ${current.country[0]} ${flag(current.country[1])} · Mastery ${mastery}%`
    : `Nope — it was ${current.country[0]} ${flag(current.country[1])} · Mastery ${mastery}%`;
  $("next").hidden = false;
}

$("next").onclick = newQuestion;
$("reset").onclick = () => {
  Object.assign(stats, { total: 0, correct: 0, streak: 0, best: 0 });
  for (let r = 0; r < N; r++) {
    matrix[r].fill(0.5);
    matrix[r][r] = 0;
  }
  save();
  newQuestion();
};

renderStats();
newQuestion();
</script>
</body>
</html>
